<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="container">

    <h1>Update Student Details</h1>

    <p class="subtitle">
        Change the student details and update the prediction.
    </p>


    <form
        action="{{ url_for(
            'save_updated_student',
            student_id=student['id']
        ) }}"
        method="POST"
    >

        <div class="grid">


            <!-- CGPA -->

            <div class="field">

                <label>CGPA (0 - 10)</label>

                <input
                    type="number"
                    name="cgpa"
                    min="0"
                    max="10"
                    step="0.01"
                    value="{{ student['cgpa'] }}"
                    required
                >

            </div>


            <!-- 10th -->

            <div class="field">

                <label>10th Percentage</label>

                <input
                    type="number"
                    name="tenth"
                    min="0"
                    max="100"
                    step="0.01"
                    value="{{ student['tenth'] }}"
                    required
                >

            </div>


            <!-- 12th -->

            <div class="field">

                <label>12th Percentage</label>

                <input
                    type="number"
                    name="twelfth"
                    min="0"
                    max="100"
                    step="0.01"
                    value="{{ student['twelfth'] }}"
                    required
                >

            </div>


            <!-- BACKLOGS -->

            <div class="field">

                <label>Number of Backlogs</label>

                <input
                    type="number"
                    name="backlogs"
                    min="0"
                    value="{{ student['backlogs'] }}"
                    required
                >

            </div>


            <!-- ATTENDANCE -->

            <div class="field">

                <label>Attendance (%)</label>

                <input
                    type="number"
                    name="attendance"
                    min="0"
                    max="100"
                    step="0.01"
                    value="{{ student['attendance'] }}"
                    required
                >

            </div>


            <!-- INTERNSHIP -->

            <div class="field">

                <label>Internship</label>

                <select name="internship" required>

                    <option
                        value="1"
                        {% if student['internship'] == 1 %}
                        selected
                        {% endif %}
                    >
                        Yes
                    </option>

                    <option
                        value="0"
                        {% if student['internship'] == 0 %}
                        selected
                        {% endif %}
                    >
                        No
                    </option>

                </select>

            </div>


            <!-- PROJECTS -->

            <div class="field">

                <label>Number of Projects</label>

                <input
                    type="number"
                    name="projects"
                    min="0"
                    value="{{ student['projects'] }}"
                    required
                >

            </div>


            <!-- COMMUNICATION -->

            <div class="field">

                <label>
                    Communication Skill (1 - 10)
                </label>

                <input
                    type="number"
                    name="communication"
                    min="1"
                    max="10"
                    value="{{ student['communication'] }}"
                    required
                >

            </div>


            <!-- TECHNICAL -->

            <div class="field">

                <label>
                    Technical Skill (1 - 10)
                </label>

                <input
                    type="number"
                    name="technical"
                    min="1"
                    max="10"
                    value="{{ student['technical'] }}"
                    required
                >

            </div>


        </div>


        <button type="submit">

            Update & Re-Predict

        </button>


    </form>


    <a
        href="/students"
        class="back-button"
    >

        Cancel

    </a>


</div>

</body>

</html>
