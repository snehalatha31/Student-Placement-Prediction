<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Student Placement Prediction
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <h1>
        Student Placement Eligibility Prediction
    </h1>

    <p class="subtitle">
        Enter student details to predict placement eligibility.
    </p>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form
        action="{{ url_for('predict') }}"
        method="POST"
    >

        <div class="grid">


            <div class="field">

                <label>
                    CGPA (0 - 10)
                </label>

                <input
                    type="number"
                    name="cgpa"
                    min="0"
                    max="10"
                    step="0.01"
                    placeholder="Example: 8.5"
                    required
                >

            </div>


            <div class="field">

                <label>
                    10th Percentage
                </label>

                <input
                    type="number"
                    name="tenth"
                    min="0"
                    max="100"
                    step="0.01"
                    placeholder="Example: 90"
                    required
                >

            </div>


            <div class="field">

                <label>
                    12th Percentage
                </label>

                <input
                    type="number"
                    name="twelfth"
                    min="0"
                    max="100"
                    step="0.01"
                    placeholder="Example: 88"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Number of Backlogs
                </label>

                <input
                    type="number"
                    name="backlogs"
                    min="0"
                    placeholder="Example: 0"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Attendance (%)
                </label>

                <input
                    type="number"
                    name="attendance"
                    min="0"
                    max="100"
                    step="0.01"
                    placeholder="Example: 92"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Internship
                </label>

                <select
                    name="internship"
                    required
                >

                    <option value="1">
                        Yes
                    </option>

                    <option value="0">
                        No
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    Number of Projects
                </label>

                <input
                    type="number"
                    name="projects"
                    min="0"
                    placeholder="Example: 3"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Communication Skill (1 - 10)
                </label>

                <input
                    type="number"
                    name="communication"
                    min="1"
                    max="10"
                    placeholder="Example: 8"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Technical Skill (1 - 10)
                </label>

                <input
                    type="number"
                    name="technical"
                    min="1"
                    max="10"
                    placeholder="Example: 9"
                    required
                >

            </div>


        </div>


        <button type="submit">

            Predict Placement Eligibility

        </button>

    </form>

</div>

</body>

</html>
